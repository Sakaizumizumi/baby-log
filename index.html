<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f73">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="宝宝日记">
    <title>宝宝日记</title>
    <link rel="manifest" href="manifest.webmanifest?v=39">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="stylesheet" href="styles.css?v=39">
    <link rel="stylesheet" href="diary.css?v=39">
    <script src="photo-utils.js?v=39" defer></script>
    <script src="diary.js?v=39" defer></script>
  </head>
  <body>
    <div class="app-shell diary-app">
      <header class="topbar">
        <div>
          <p class="eyebrow">宝宝的每一天</p>
          <h1>宝宝日记</h1>
        </div>
        <nav class="topbar-actions" aria-label="页面导航">
          <a class="status-pill nav-pill" href="index.html" aria-current="page">日记</a>
          <a class="status-pill nav-pill" href="quick.html">快速记录</a>
          <a class="status-pill nav-pill" href="records.html">喂养记录</a>
          <a class="status-pill nav-pill" href="photos.html">照片记录</a>
        </nav>
      </header>
      <main>
        <section class="diary-composer" aria-labelledby="composerTitle">
          <div class="diary-section-heading">
            <h2 id="composerTitle">记一件小事</h2>
            <span class="diary-subtle" id="todayLabel"></span>
          </div>
          <p class="diary-error" id="storageError" role="alert" hidden></p>
          <form id="diaryForm">
            <fieldset class="diary-fields" id="composerFields" disabled>
              <label class="field">
                <span>日记内容</span>
                <textarea id="entryText" rows="4" maxlength="10000" placeholder="今天，宝宝……" required></textarea>
              </label>
              <div class="diary-time-row">
                <label class="field">
                  <span>时间</span>
                  <input id="entryTime" type="datetime-local" required>
                </label>
                <button class="ghost-button" type="button" id="diaryNow">现在</button>
              </div>
              <div class="diary-attachment-toolbar">
                <button class="secondary-button compact-button" id="chooseImages" type="button">添加图片</button>
                <button class="ghost-button compact-button" id="takePhoto" type="button">拍照</button>
                <span class="diary-subtle" id="attachmentCount" role="status"></span>
                <input id="entryPhotos" type="file" accept="image/*,.heic,.heif,.hif,.jpg,.jpeg,.png,.webp,.avif" multiple hidden>
                <input id="cameraPhoto" type="file" accept="image/*,.heic,.heif,.hif" capture="environment" hidden>
              </div>
              <div class="diary-attachments" id="attachmentPreview" aria-label="待保存图片"></div>
              <p class="diary-error" id="photoError" role="alert" hidden></p>
              <div class="diary-submit-row">
                <label class="diary-first-check">
                  <input id="entryFirst" type="checkbox">
                  <span>属于第一次</span>
                </label>
                <div class="diary-submit-actions">
                  <button class="ghost-button" id="cancelEntryEdit" type="button" hidden>取消编辑</button>
                  <button class="primary-button" id="saveEntry" type="submit">添加日记</button>
                </div>
              </div>
            </fieldset>
          </form>
        </section>
        <section class="diary-journal" aria-label="日记与第一次">
          <div class="diary-journal-toolbar">
            <div class="diary-tabs" role="tablist" aria-label="查看内容">
              <button id="diaryTab" type="button" role="tab" aria-selected="true" aria-controls="diaryPanel" tabindex="0">日记 <span id="diaryCount">0</span></button>
              <button id="firstsTab" type="button" role="tab" aria-selected="false" aria-controls="firstsPanel" tabindex="-1">第一次 <span id="firstsCount">0</span></button>
            </div>
            <label class="diary-date-filter">
              <span class="diary-subtle">日期</span>
              <input id="diaryDateFilter" type="date" aria-label="按日期查看日记">
            </label>
            <button class="ghost-button compact-button" id="clearDiaryFilter" type="button" hidden>全部日期</button>
          </div>
          <div id="diaryPanel" role="tabpanel" aria-labelledby="diaryTab" tabindex="0">
            <div id="diaryList" class="diary-list" aria-live="polite">
              <p class="empty-state">正在读取日记</p>
            </div>
          </div>
          <div id="firstsPanel" role="tabpanel" aria-labelledby="firstsTab" tabindex="0" hidden>
            <div id="firstsList" class="diary-list" aria-live="polite"></div>
          </div>
        </section>
        <details class="diary-backup">
          <summary>日记备份</summary>
          <div class="backup-actions">
            <button class="secondary-button" type="button" id="exportDiary" disabled>导出日记备份</button>
            <button class="secondary-button" type="button" id="importDiaryButton" disabled>导入日记备份</button>
            <input id="importDiary" type="file" accept="application/json,.json" hidden>
          </div>
        </details>
      </main>
    </div>
    <dialog class="diary-photo-dialog" id="diaryPhotoDialog" aria-labelledby="photoDialogTitle">
      <div class="dialog-header">
        <h2 id="photoDialogTitle">日记图片</h2>
        <button class="icon-button" id="closeDiaryPhoto" type="button" aria-label="关闭图片" title="关闭图片">×</button>
      </div>
      <img id="diaryPhotoImage" alt="日记附图">
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
