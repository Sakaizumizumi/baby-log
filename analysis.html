<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f6f73">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="规律分析">
    <title>新生儿规律分析</title>
    <link rel="manifest" href="manifest.webmanifest?v=37">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="stylesheet" href="styles.css?v=37">
    <link rel="stylesheet" href="analysis.css?v=37">
  </head>
  <body>
    <div class="app-shell analysis-app">
      <header class="topbar">
        <div>
          <p class="eyebrow">新生儿记录</p>
          <h1>规律分析</h1>
        </div>
        <div class="topbar-actions">
          <a class="status-pill nav-pill" href="quick.html">快速记录</a>
          <a class="status-pill nav-pill" href="index.html">完整记录</a>
          <a class="status-pill nav-pill" href="photos.html">照片</a>
        </div>
      </header>

      <main>
        <section class="tool-panel" aria-labelledby="rangeTitle">
          <div class="section-header">
            <h2 id="rangeTitle">统计范围</h2>
          </div>
          <div class="analysis-range-grid">
            <label class="field">
              <span>范围</span>
              <select id="rangeMode">
                <option value="all">全部历史</option>
                <option value="recent7">最近 7 天</option>
                <option value="recent14">最近 14 天</option>
                <option value="custom">自定义日期</option>
              </select>
            </label>
            <div class="analysis-custom-range" id="customRangeFields" hidden>
              <label class="field">
                <span>开始日期</span>
                <input id="rangeStart" type="date">
              </label>
              <label class="field">
                <span>结束日期</span>
                <input id="rangeEnd" type="date">
              </label>
            </div>
          </div>
        </section>

        <section class="summary-grid analysis-overview" aria-label="分析概览">
          <article class="metric">
            <span>记录范围</span>
            <strong id="coverageRange">--</strong>
            <small id="coverageDays">--</small>
          </article>
          <article class="metric">
            <span>总记录数</span>
            <strong id="totalRecords">0</strong>
            <small id="categoryCounts">吃奶 0 · 小便 0 · 大便 0</small>
          </article>
          <article class="metric accent">
            <span>分析方式</span>
            <strong id="analysisModeLabel">全部历史</strong>
            <small>只统计客观规律，不作诊断</small>
          </article>
        </section>

        <section class="tool-panel" id="emptyPanel" hidden>
          <div class="empty-state" id="emptyMessage">暂无历史记录，添加吃奶或大小便记录后这里会自动生成分析。</div>
        </section>

        <div id="analysisContent" hidden>
          <section class="tool-panel" aria-labelledby="nextReferenceTitle">
            <div class="section-header">
              <h2 id="nextReferenceTitle">下一次参考</h2>
              <span class="analysis-hint">按清洗后的历史间隔推算，不是提醒</span>
            </div>
            <div class="next-reference-grid" id="nextReferenceCards"></div>
          </section>

          <section class="analysis-card-grid" id="patternCards" aria-label="核心规律"></section>

          <details class="analysis-detail-panel" open>
            <summary>次数变化</summary>
            <div class="analysis-panel-body">
              <div class="analysis-summary-grid" id="trendSummary"></div>
              <div class="daily-trend" id="dailyTrend"></div>
            </div>
          </details>

          <details class="analysis-detail-panel" open>
            <summary>间隔规律</summary>
            <div class="analysis-panel-body">
              <div class="analysis-summary-grid" id="intervalSummary"></div>
              <div class="analysis-chart-grid" id="intervalCharts"></div>
            </div>
          </details>

          <details class="analysis-detail-panel">
            <summary>时间规律</summary>
            <div class="analysis-panel-body">
              <div class="section-header compact-section-header">
                <h2>3 小时时段分布</h2>
                <span class="analysis-hint">次数越高，条越长</span>
              </div>
              <div class="analysis-chart-grid" id="distributionCharts"></div>
              <div class="section-header compact-section-header">
                <h2>日期 × 时段热力图</h2>
                <span class="analysis-hint">颜色越深，次数越多</span>
              </div>
              <div class="heatmap-list" id="timeHeatmap"></div>
            </div>
          </details>

          <details class="analysis-detail-panel">
            <summary>喂奶细分</summary>
            <div class="analysis-panel-body">
              <div class="feed-extra-grid" id="feedExtra"></div>
              <div class="analysis-breakdown" id="feedBreakdown"></div>
            </div>
          </details>

          <details class="analysis-detail-panel">
            <summary>尿便细分</summary>
            <div class="analysis-panel-body">
              <div class="analysis-breakdown" id="diaperBreakdown"></div>
            </div>
          </details>

          <details class="analysis-detail-panel">
            <summary>疑似漏记间隔明细</summary>
            <div class="analysis-panel-body">
              <div class="excluded-list" id="excludedIntervals"></div>
            </div>
          </details>
        </div>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="analysis.js?v=37" defer></script>
  </body>
</html>
